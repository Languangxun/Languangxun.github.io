<!doctype html>
<html lang="{{ site.lang | default: 'zh' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }} · {{ site.tagline }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#050506">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.url == '/' %}{{ site.title }} · {{ site.tagline }}{% else %}{{ page.title }}{% endif %}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ '/assets/img/avatar.png' | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/avatar.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-nav">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">獨<span>白</span></a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>首页</a>
        <a href="{{ '/docs/' | relative_url }}"{% if page.url contains "/docs" %} class="active"{% endif %}>项目文档</a>
        <a href="https://github.com/Languangxun" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p class="sig">擇善固執 · 初心不渝</p>
    <p class="foot-links">
      <a href="https://t.me/Monologue_101" target="_blank" rel="noopener">Telegram</a>
      <span>·</span>
      <span>QQ 2180287399</span>
      <span>·</span>
      <a href="https://github.com/Languangxun/Languangxun.github.io" target="_blank" rel="noopener">本站源码</a>
    </p>
    <p class="copy">© 2026 獨白</p>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
